name: Update & filter extensions repo (no NSFW)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة

permissions:
  contents: write

jobs:
  update_filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure jq is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Save local README
        run: |
          if [ -f README.md ]; then
            cp README.md /tmp/README.local
          fi

      - name: Fetch upstream repo
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git || true
          git fetch upstream

      - name: Update selected files from upstream (sync)
        run: |
          git checkout upstream/repo -- apk icon index.html index.json index.min.json
          # امسح الملفات اللي اتحذفت upstream
          git checkout . && git status --porcelain

      - name: Restore local README
        run: |
          if [ -f /tmp/README.local ]; then
            mv /tmp/README.local README.md
          fi

      - name: Filter NSFW from index files
        run: |
          jq '[.[] | select(.nsfw != 1)]' index.json > index.tmp.json
          jq -c '[.[] | select(.nsfw != 1)]' index.min.json > index.tmp.min.json
          mv index.tmp.json index.json
          mv index.tmp.min.json index.min.json

      - name: Commit & push changes
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk icon index.html index.json index.min.json README.md
          git commit -m "Update extensions & filter NSFW (keep README)" || exit 0
          git push
